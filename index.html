<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b2a4a">
<title>Reel Legends: Miami Beach</title>
<style>
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#06182c;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;color:#fff;overscroll-behavior:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl);pointer-events:none;visibility:hidden}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(var(--st) + 6px) calc(var(--sr) + 8px) 0 calc(var(--sl) + 8px);display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
.pill{background:linear-gradient(180deg,rgba(14,40,70,.88),rgba(6,22,42,.88));border:1.5px solid rgba(255,255,255,.18);border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#lvl{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;height:44px}
#lvlBadge{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f2a52b 60%,#b86b06);display:grid;place-items:center;font-weight:900;color:#5a2d00;font-size:15px;box-shadow:0 0 0 2px #fff6,inset 0 -2px 3px #0003}
#xpWrap{width:86px}
#xpTxt{font-size:9.5px;white-space:nowrap;opacity:.8;font-weight:700;letter-spacing:.3px}
#xpBar{height:7px;border-radius:4px;background:#0006;overflow:hidden;margin-top:3px}
#xpFill{height:100%;width:0;background:linear-gradient(90deg,#5eead4,#22d3ee);transition:width .4s}
#coins{display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;height:44px;font-weight:900;font-size:17px;color:var(--gold)}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc83d 55%,#c27c00);box-shadow:inset 0 -2px 2px #0003,0 0 0 1.5px #8a5a00;display:inline-block;flex:none;position:relative}
.coin:after{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid #b07000aa}
#slots{display:flex;gap:6px;padding:4px 6px;height:52px;align-items:center;margin-left:auto;margin-right:auto}
.slot{width:44px;height:44px;border-radius:11px;background:radial-gradient(circle at 50% 40%,rgba(80,150,210,.35),rgba(0,0,0,.35));border:1.5px solid rgba(255,255,255,.2);position:relative;display:grid;place-items:center;overflow:hidden}
.slot img{max-width:40px;max-height:30px;transform:scale(1.08)}
.slot .sil{filter:brightness(0) opacity(.55)}
.slot .cnt{position:absolute;bottom:1px;right:3px;font-size:9.5px;font-weight:900;text-shadow:0 1px 2px #000}
.slot .gbar{position:absolute;left:3px;right:3px;bottom:2px;height:4px;border-radius:2px;background:#0007;overflow:hidden}
.slot .gbar i{display:block;height:100%;background:#4ade80}
.slot.last{border-color:var(--gold);box-shadow:0 0 10px #ffd16655}
.slot.done{animation:pop .6s}
.slot .tag{position:absolute;top:1px;left:3px;font-size:8px;font-weight:900;opacity:.85}
#env{font-size:12px;font-weight:800;padding:0 10px;height:30px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn{border:0;color:#fff;font:inherit;font-weight:900;cursor:pointer;touch-action:manipulation}
.ibtn{width:44px;height:44px;border-radius:13px;font-size:20px;display:grid;place-items:center;padding:0}
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,10,24,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:calc(var(--st) + 8px) calc(var(--sr) + 10px) calc(var(--sb) + 8px) calc(var(--sl) + 10px)}
#modal.show{display:flex}
.panel{background:linear-gradient(180deg,#123a63,#0a2340);border:2px solid rgba(255,255,255,.2);border-radius:20px;box-shadow:0 20px 50px #000a,inset 0 1px 0 #fff3;max-height:100%;width:min(640px,100%);display:flex;flex-direction:column;animation:zin .35s cubic-bezier(.2,1.6,.4,1)}
.phead{display:flex;align-items:center;padding:10px 12px 6px 16px;gap:8px}
.phead h2{margin:0;font-size:20px;flex:1;letter-spacing:.5px}
.close{width:38px;height:38px;border-radius:12px;background:#ffffff1f;font-size:18px}
.pbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 14px;touch-action:pan-y}
.tabs{display:flex;gap:6px}
.tab{padding:8px 14px;border-radius:11px;background:#ffffff14;font-size:14px}
.tab.on{background:linear-gradient(180deg,#ffd166,#f59e0b);color:#4a2500}
.row{display:flex;align-items:center;gap:10px;background:#ffffff0d;border:1px solid #ffffff14;border-radius:14px;padding:8px 10px;margin-top:8px}
.row .ic{width:52px;height:52px;border-radius:12px;background:radial-gradient(circle,#3b82c455,#0003);display:grid;place-items:center;font-size:28px;flex:none}
.row .ic img{max-width:44px;max-height:44px}
.row .tx{flex:1;min-width:0}
.row .tx b{font-size:15px}.row .tx div{font-size:12px;opacity:.75;margin-top:2px}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:12px;height:6px;border-radius:3px;background:#ffffff22}.pips i.on{background:#5eead4}
.buy{min-width:96px;height:42px;border-radius:12px;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 3px 0 #0b6b2e;font-size:15px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 10px}
.buy .coin{width:16px;height:16px}.buy .coin:after{inset:3px}
.buy.no{background:linear-gradient(180deg,#64748b,#475569);box-shadow:0 3px 0 #1e293b;opacity:.75}
.buy.eq{background:linear-gradient(180deg,#ffd166,#f59e0b);box-shadow:0 3px 0 #92400e;color:#4a2500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.card{border-radius:14px;padding:6px 4px 6px;text-align:center;background:#ffffff0d;border:2px solid #ffffff18;position:relative}
.card img{height:44px;max-width:88px;object-fit:contain;display:block;margin:2px auto 4px}
.card img.sil{filter:brightness(0) opacity(.5)}
.card b{font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{font-size:10px;opacity:.75;display:block}
.stat{display:flex;gap:14px;font-size:12px;opacity:.85;flex-wrap:wrap}
#catch{position:relative;width:min(600px,100%);display:flex;flex-direction:row;align-items:center;gap:14px;padding:16px 18px}
#rays{position:absolute;width:300px;height:300px;left:-10px;top:50%;margin-top:-150px;border-radius:50%;background:repeating-conic-gradient(var(--rc) 0 10deg,transparent 10deg 20deg);opacity:.35;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%)}
#cFish{width:250px;height:170px;object-fit:contain;position:relative;filter:drop-shadow(0 8px 12px #0008);animation:flop 1.6s ease-in-out infinite;flex:none}
#cInfo{position:relative;flex:1;min-width:0}
#cRar{display:inline-block;padding:3px 10px;border-radius:9px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#111}
#cName{font-size:26px;font-weight:900;margin:6px 0 2px;line-height:1.05;text-shadow:0 2px 0 #0006}
#cW{font-size:15px;opacity:.9}
#cNew{display:inline-block;margin-left:6px;background:#ef4444;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:900;animation:pulse 1s infinite}
#cRew{display:flex;gap:10px;margin-top:10px;font-weight:900;font-size:17px;align-items:center;flex-wrap:wrap}
#cRew span{display:flex;align-items:center;gap:5px;background:#0004;padding:5px 10px;border-radius:10px}
#cGo{margin-top:12px;height:46px;padding:0 22px;border-radius:14px;background:linear-gradient(180deg,#38bdf8,#0284c7);box-shadow:0 4px 0 #075985;font-size:17px}
#toast{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(180deg,#1e3a5f,#0f2640);border:1.5px solid var(--gold);padding:8px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 8px 20px #0008;animation:tin .4s cubic-bezier(.2,1.6,.4,1),tout .4s 2.6s forwards;white-space:nowrap}
#rotate{position:fixed;inset:0;z-index:100;display:none;background:radial-gradient(circle at 50% 40%,#134a7c,#04121f);flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px}
#rotate .ph{width:70px;height:120px;border:5px solid #fff;border-radius:16px;position:relative;animation:rot 2s ease-in-out infinite}
#rotate .ph:after{content:"";position:absolute;bottom:6px;left:50%;width:18px;height:4px;margin-left:-9px;background:#fff;border-radius:2px}
#rotate h1{margin:0;font-size:24px}#rotate p{margin:0;opacity:.8}
@media (orientation:portrait){#rotate{display:flex}}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(10,40,80,.35),rgba(2,10,24,.85));gap:10px;text-align:center}
#start h1{margin:0;font-size:46px;font-weight:900;letter-spacing:1px;background:linear-gradient(180deg,#fff7d6,#ffd166 50%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a3d00) drop-shadow(0 8px 14px #000a)}
#start p{margin:0;opacity:.9;font-size:15px;max-width:520px;line-height:1.4}
#start .go{margin-top:8px;height:56px;padding:0 40px;border-radius:18px;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 5px 0 #0b6b2e,0 10px 30px #16a34a66;font-size:22px;animation:pulse 1.4s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flop{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(5deg) scale(1.04)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes zin{from{transform:scale(.7);opacity:0}}
@keyframes tin{from{transform:translateY(-20px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-12px);opacity:0}}
@keyframes rot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
</style></head><body>
<canvas id="cv"></canvas><div id="probe"></div>
<div id="hud">
  <div id="lvl" class="pill"><div id="lvlBadge">1</div><div id="xpWrap"><div id="xpTxt">LEVEL 1</div><div id="xpBar"><div id="xpFill"></div></div></div></div>
  <div id="coins" class="pill"><span class="coin"></span><span id="coinTxt">0</span></div>
  <div id="slots" class="pill"></div>
  <div id="env" class="pill">☀️ Day</div>
  <button class="btn ibtn pill" id="bBook" aria-label="Fish book">📖</button>
  <button class="btn ibtn pill" id="bShop" aria-label="Shop">🛒</button>
  <button class="btn ibtn pill" id="bMute" aria-label="Sound">🔊</button>
</div>
<div id="toast"></div>
<div id="modal"></div>
<div id="start"><h1>REEL LEGENDS</h1><div style="font-weight:900;letter-spacing:6px;color:#ff4fd8;text-shadow:0 0 8px #ff4fd8,0 0 18px #ff4fd8">MIAMI BEACH</div><p>Tap the <b>reel</b> to start your power meter, tap again in the <b style="color:#ffd166">gold zone</b> for a perfect cast. When the bobber dives — <b>tap fast</b> to hook and reel, but ease off when the fish runs!</p><button class="btn go" id="bStart">TAP TO FISH</button></div>

function pickFish(){const ph=phaseName(),lu=LURES[S.lure];const rw=[60,26,10,3.4,.9];
 let tot=0,ws=FISH.map((f,i)=>{let w=rw[f.r]*f.lu[S.lure];if(f.tm)w*=(f.tm[ph]??1);if(f.wx)w*=(f.wx[G.wx]??1);
  if(f.far){w*=G.dist>=f.far?1.6:Math.max(0,(G.dist-f.far+.35))/.35*.5;}
  if(f.r>=2){w*=(1+G.dist*.8)*(G.perfect?1.6:1)*(lu.rb||1)*(G.wx==='storm'?1.4:1)*(1+Math.min(G.combo,10)*.04);}
  if(f.r===4&&S.lvl<4)w*=.2;
  return Math.max(0,w);});
 ws.forEach(w=>tot+=w);let x=Math.random()*tot;for(let i=0;i<ws.length;i++){x-=ws[i];if(x<=0)return i;}return 0;}
// ---------- input ----------
function inReel(x,y){const r=L.reel;return Math.hypot(x-r.x,y-r.y)<r.r*1.35;}
function wheelHit(x,y){const w=L.wheel,dx=x-w.x,dy=w.y-y,d=Math.hypot(dx,dy);if(d>w.R||dx<0||dy<0)return -1;if(d<w.R*.26)return -2;const a=Math.atan2(dy,dx);return clamp(Math.floor((Math.PI/2-a)/(Math.PI/2)*5),0,4);}
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.unlock();const x=e.clientX,y=e.clientY;
 const wh=wheelHit(x,y);if(wh!==-1){if(['idle'].includes(G.st)||wh===-2){if(wh>=0)selectLure(wh);else openShop('lures');}else toast('Reel in before switching lures');return;}
 if(inReel(x,y)||['fight','bite','power'].includes(G.st))action();
},{passive:false});
document.addEventListener('touchmove',e=>{if(!e.target.closest('.pbody'))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
['touchstart','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>AU.unlock(),{passive:true}));
function selectLure(i){if(!S.lures[i]){openShop('lures');return;}if(S.lure!==i){S.lure=i;save();AU.tone(700,.08,'triangle',.15);AU.tone(1050,.1,'triangle',.12,.05);toast('🎣 '+LURES[i].n+' equipped');}}
function action(){G.hint=false;
 switch(G.st){
 case 'idle':G.st='power';G.mt=0;const zw=zoneW();const z0=rnd(.62,.93-zw);G.zone=[z0,z0+zw];AU.click();break;
 case 'power':{const v=G.mv;G.perfect=v>=G.zone[0]&&v<=G.zone[1];G.dist=clamp(v*rodReach()+(G.perfect?.12:0),.05,1);
  S.stats.casts++;if(G.perfect){G.pstreak++;S.stats.perfect++;AU.perfect();floatTxt(L.meter.x,L.meter.top+(1-v)*(L.meter.bot-L.meter.top),'PERFECT!','#ffd166',22);progressGoal('perfect',1);if(G.pstreak>=3)toast('✨ Perfect streak x'+G.pstreak);}else{G.pstreak=0;}
  G.st='cast';G.castT=0;G.from={...G.tip};const by=lerp(L.nearY,L.farY,Math.pow(G.dist,.85));G.target={x:W*.4+rnd(-1,1)*W*.07*(1-G.dist*.5),y:by,sc:lerp(1,.42,G.dist)};AU.whoosh();save();break;}
 case 'wait':G.st='retrieve';G.retT=0;AU.tick();if(G.nib>0){msg('Too eager — you spooked it!');}break;
 case 'bite':startFight();break;
 case 'fight':reelTap();break;
 }}
// ---------- flow ----------
function landBobber(){G.st='wait';G.bob={x:G.target.x,y:G.target.y,sc:G.target.sc,dip:0};G.fishId=pickFish();
 const f=FISH[G.fishId];G.bite=rnd(1.6,4.8)/LURES[S.lure].spd+f.r*.5;G.nibT=rnd(.6,G.bite*.8);G.nib=0;
 AU.plop(1.2-G.dist*.4);splash(G.bob.x,G.bob.y,14*G.bob.sc+6,G.bob.sc);}
function doBite(){G.st='bite';G.biteWin=.95+.03*S.up.reel;G.bob.dip=1;AU.bite();G.shake=Math.max(G.shake,6);splash(G.bob.x,G.bob.y,26,G.bob.sc*1.3);if(navigator.vibrate)navigator.vibrate(60);
 FT.push({x:G.bob.x,y:G.bob.y-40*G.bob.sc-10,t:'!',c:'#ff4d4d',s:46,life:G.biteWin,max:G.biteWin,bang:1});}
function startFight(){const f=FISH[G.fishId];const wr=Math.pow(Math.random(),1.6);const w=+(lerp(f.w[0],f.w[1],wr)).toFixed(f.w[1]<5?2:1);
 const taps=Math.max(5,Math.round(([7,10,14,19,27][f.r]+wr*7)/reelPow()));
 G.fight={id:G.fishId,w,wr,taps,p:0,ten:.12,str:([.055,.068,.082,.098,.11][f.r]*(.85+.35*wr))/lineStr(),time:taps*.45+5,tmax:taps*.45+5,surge:0,surgeT:rnd(1.2,2.4),sx:0,dir:1,lastTap:0};
 G.st='fight';AU.hook();G.shake=10;if(navigator.vibrate)navigator.vibrate(80);msg(f.r>=3?'⚠️ Something HUGE is on the line!':f.r>=2?'It\'s a strong one!':'Fish on! Tap to reel!');}
function reelTap(){const F=G.fight;const mult=F.surge>0?2.3:1;F.ten+=F.str*mult;F.p+=(1/F.taps)*(F.surge>0?.45:1);G.crankV+=2.2;AU.tick();if(F.ten>.7)AU.creak();
 F.lastTap=G.t;for(let i=0;i<2;i++)P.push({x:G.bob.x+rnd(-8,8),y:G.bob.y,vx:rnd(-60,60),vy:rnd(-120,-50),life:.5,max:.5,c:'rgba(255,255,255,.9)',s:rnd(2,4)*G.bob.sc+1,g:300});
 if(F.p>=1)landFish();else if(F.ten>=1)loseFish('snap');}
function landFish(){G.st='land';G.landT=0;AU.splash();G.shake=12;splash(G.bob.x,G.bob.y,40,G.bob.sc*1.6);}
function loseFish(why){G.combo=0;S.stats.lost++;G.st='retrieve';G.retT=0;G.fight=null;
 if(why==='snap'){AU.snap();G.shake=14;G.flash=.4;msg('💥 SNAP! The line broke — ease off during runs!');}else if(why==='time'){AU.fail();msg('The fish wore you out and got away…');}else{AU.fail();msg('Missed the bite! Tap as soon as it dives.');}
 save();}
function finishCatch(){const F=G.fight,f=FISH[F.id];G.combo++;S.stats.catches++;S.stats.bestCombo=Math.max(S.stats.bestCombo,G.combo);
 const cm=1+Math.min(G.combo-1,15)*.1;const coins=Math.round([6,16,45,140,600][f.r]*(.7+.9*F.wr)*cm*(G.perfect?1.25:1));const xp=Math.round([6,12,28,70,220][f.r]*(.8+.5*F.wr));
 const b=S.book[F.id]||{n:0,best:0};const isNew=b.n===0,rec=!isNew&&F.w>b.best;b.n++;b.best=Math.max(b.best,F.w);S.book[F.id]=b;S.last=F.id;
 S.coins+=coins+(isNew?25*(f.r+1):0);addXP(xp);
 progressGoal('catch',1);progressGoal('rarity',1,f.r);progressGoal('species',1,F.id);progressGoal('weight',F.w);progressGoal('combo',G.combo);
 save();renderHUD();showCatch(F,f,coins,xp,isNew,rec,cm);
 AU.fanfare(f.r);setTimeout(()=>AU.coin(),350);if(f.r>=2)confetti(f.r);}
function addXP(x){S.xp+=x;let need=xpNeed(S.lvl);while(S.xp>=need){S.xp-=need;S.lvl++;need=xpNeed(S.lvl);const bonus=50*S.lvl;S.coins+=bonus;setTimeout(()=>{AU.levelup();toast('⭐ LEVEL '+S.lvl+'! +'+bonus+' coins');confetti(2);},900);}}
function xpNeed(l){return Math.round(60*Math.pow(l,1.45));}
// ---------- goals ----------
function newGoal(){const L2=S.lvl,known=Object.keys(S.book).map(Number);const opts=[
 ()=>({k:'catch',n:5+Math.floor(L2*1.2),t:'Catch fish'}),
 ()=>({k:'perfect',n:2+Math.floor(L2/3),t:'Perfect casts'}),
 ()=>({k:'rarity',r:Math.min(3,1+Math.floor(L2/4)),n:1+Math.floor(L2/6)}),
 ()=>{const pool=FISH.map((f,i)=>i).filter(i=>FISH[i].r<=Math.min(4,1+Math.floor(L2/3))&&(FISH[i].lu[S.lure]>0||S.lures[4]));const id=pool[Math.floor(Math.random()*pool.length)];return {k:'species',id,n:1+(FISH[id].r===0?2:0)};},
 ()=>({k:'combo',n:3+Math.floor(L2/2)}),
 ()=>({k:'weight',n:Math.round(5*Math.pow(1.5,Math.min(L2,10)))})];
 const g=opts[Math.floor(Math.random()*opts.length)]();g.p=0;g.rw=Math.round((40+L2*18)*(g.k==='rarity'?1+g.r*.6:1)*(g.k==='species'?1.2:1));return g;}
function ensureGoals(){while(S.goals.length<3)S.goals.push(newGoal());}
function goalLabel(g){switch(g.k){case'catch':return 'Catch '+g.n+' fish';case'perfect':return 'Land '+g.n+' perfect casts';case'rarity':return 'Catch '+g.n+' '+RAR[g.r].n+'+ fish';case'species':return 'Catch '+(g.n>1?g.n+'× ':'a ')+FISH[g.id].n;case'combo':return 'Reach a '+g.n+'-catch combo';case'weight':return 'Land a fish over '+g.n+' lb';}}
function progressGoal(k,v,extra){let changed=false;S.goals.forEach((g,i)=>{if(g.k!==k||g.p>=g.n)return;
 if(k==='rarity'){if(extra>=g.r){g.p++;changed=true;}}else if(k==='species'){if(extra===g.id){g.p++;changed=true;}}else if(k==='combo'){g.p=Math.max(g.p,v);changed=true;}else if(k==='weight'){if(v>=g.n){g.p=g.n;changed=true;}}else{g.p+=v;changed=true;}
 if(g.p>=g.n){g.p=g.n;S.coins+=g.rw;setTimeout(()=>{toast('🏆 Goal complete: '+goalLabel(g)+'  +'+g.rw);AU.coin();},k==='perfect'?200:1300);
  setTimeout(()=>{const j=S.goals.indexOf(g);if(j>=0){S.goals[j]=newGoal();save();renderHUD(i);}},3000);}});
 if(changed){save();renderHUD();}}
// ---------- juice ----------
function splash(x,y,n,s){for(let i=0;i<n;i++){const a=rnd(-Math.PI*.95,-Math.PI*.05);const sp=rnd(60,240)*s;P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.4,.9),max:.9,c:Math.random()<.5?'rgba(255,255,255,.95)':'rgba(170,225,255,.9)',s:rnd(1.5,4)*s+1,g:520});}
 P.push({ring:1,x,y,r:4*s,vr:70*s,life:.8,max:.8,s});P.push({ring:1,x,y,r:2,vr:45*s,life:1.1,max:1.1,s});}
function confetti(r){const cols=['#ffd166','#ef476f','#06d6a0','#118ab2','#c084fc','#fff'];for(let i=0;i<40+r*25;i++)P.push({x:W/2+rnd(-60,60),y:H*.35,vx:rnd(-380,380),vy:rnd(-520,-120),life:rnd(1.4,2.6),max:2.6,c:cols[i%6],s:rnd(3,7),g:420,conf:1,rot:rnd(0,6),vrot:rnd(-10,10)});}
function floatTxt(x,y,t,c,s=20){FT.push({x,y,t,c,s,life:1.2,max:1.2});}
function msg(t){G.msg=t;G.msgT=2.6;}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;const tc=document.getElementById('toast');tc.appendChild(d);if(tc.children.length>3)tc.firstChild.remove();setTimeout(()=>d.remove(),3100);}
// ---------- update ----------
function update(dt){G.t+=dt;S.clock+=dt;
 G.wxT-=dt;if(G.wxT<=0){const o=['clear','clear','cloudy','rain','storm'];const nw=o[Math.floor(Math.random()*o.length)];if(nw!==G.wx){G.wx=nw;toast({clear:'☀️ Skies clear',cloudy:'☁️ Clouds roll in',rain:'🌧️ Rain — fish are active',storm:'⛈️ STORM! Rare fish rising!'}[nw]);}G.wxT=rnd(70,130);}
 if(G.wx==='storm'&&Math.random()<dt*.07){G.flash=.5;setTimeout(()=>AU.thunder(),300);}
 G.shake=Math.max(0,G.shake-dt*30);G.flash=Math.max(0,G.flash-dt*1.5);G.msgT-=dt;
 G.crank+=G.crankV*dt;G.crankV*=Math.pow(.02,dt);
 const sway=Math.sin(G.t*1.3)*3;
 // rod tip
 let tx=L.tip0.x+sway,ty=L.tip0.y+Math.sin(G.t*1.1)*2;
 if(G.st==='power'){tx+=W*.05*G.mv;ty+=H*.04*G.mv;}
 if(G.st==='cast'){const k=G.castT/.75;const whip=Math.sin(Math.min(1,k*2.2)*Math.PI);tx-=W*.03*whip;ty-=H*.03*whip;}
 if(G.st==='fight'){const F=G.fight;const pull=F.ten;tx=lerp(tx,G.bob.x,.25*pull+.08);ty=lerp(ty,L.tip0.y+H*.18,pull*.6);tx+=Math.sin(G.t*30)*pull*3;}
 if(G.st==='bite'){ty+=10;tx=lerp(tx,G.bob.x,.1);}
 G.tip.x=lerp(G.tip.x||tx,tx,Math.min(1,dt*14));G.tip.y=lerp(G.tip.y||ty,ty,Math.min(1,dt*14));
 switch(G.st){
 case 'power':{G.mt+=dt;const f=.85+.05*Math.min(G.combo,10);G.mv=.5-.5*Math.cos(G.mt*Math.PI*2*f);break;}
 case 'cast':{G.castT+=dt;const k=Math.min(1,G.castT/.75);G.bob.x=lerp(G.from.x,G.target.x,k);G.bob.y=lerp(G.from.y,G.target.y,k)-Math.sin(k*Math.PI)*H*.22;G.bob.sc=lerp(1,G.target.sc,k);if(k>=1)landBobber();break;}
 case 'wait':{G.bite-=dt;G.nibT-=dt;if(G.nib>0)G.nib-=dt;
  if(G.nibT<=0&&G.bite>.8){G.nib=.35;G.nibT=rnd(.9,2.2);AU.nibble();P.push({ring:1,x:G.bob.x,y:G.bob.y,r:3,vr:30*G.bob.sc,life:.6,max:.6,s:G.bob.sc});}
  G.bob.dip=G.nib>0?Math.sin((.35-G.nib)/.35*Math.PI)*.45:0;if(G.bite<=0)doBite();break;}
 case 'bite':G.biteWin-=dt;G.bob.dip=.9+Math.sin(G.t*40)*.1;if(Math.random()<dt*20)P.push({x:G.bob.x+rnd(-10,10),y:G.bob.y,vx:rnd(-40,40),vy:rnd(-140,-60),life:.4,max:.4,c:'#fff',s:2.5*G.bob.sc+1,g:400});if(G.biteWin<=0)loseFish('miss');break;
 case 'fight':{const F=G.fight;F.time-=dt;F.surgeT-=dt;
  if(F.surge>0){F.surge-=dt;F.ten+=dt*.1;F.p=Math.max(0,F.p-dt*.07);F.dir=Math.sign(Math.sin(G.t*2))||1;if(Math.random()<dt*25)splash(G.bob.x+rnd(-6,6),G.bob.y,2,G.bob.sc*.8);}
  else{F.ten=Math.max(0,F.ten-dt*(.42+.03*S.up.line));}
  if(F.surgeT<=0&&F.surge<=0){F.surge=rnd(.55,1)+FISH[F.id].r*.12;F.surgeT=rnd(1.4,2.8)-FISH[F.id].r*.15+F.surge;AU.tone(160,.3,'sawtooth',.12,0,60);G.shake=Math.max(G.shake,5);}
  F.sx=Math.sin(G.t*(F.surge>0?7:2.5))*(F.surge>0?20:9)*G.bob.sc;G.bob.dip=.35+F.ten*.3;
  const bx=G.target.x+F.sx,by=lerp(G.target.y,L.nearY+10,F.p);G.bob.x=lerp(G.bob.x,bx,dt*6);G.bob.y=lerp(G.bob.y,by,dt*6);G.bob.sc=lerp(G.target.sc,1.05,F.p);
  if(F.ten>=1)loseFish('snap');else if(F.time<=0)loseFish('time');break;}
 case 'land':G.landT+=dt;if(G.landT>=.95&&!G.caught){G.caught=1;finishCatch();}break;
 case 'retrieve':{G.retT+=dt;const k=Math.min(1,G.retT/.45);G.bob.x=lerp(G.bob.x,G.tip.x,k);G.bob.y=lerp(G.bob.y,G.tip.y+30,k);if(k>=1){G.st='idle';G.bob.dip=0;}if(Math.random()<.3)AU.tick();break;}
 }
 // ambient shadows
 if(G.shadows.length<3&&Math.random()<dt*.3){const id=Math.floor(Math.random()*9),dir=Math.random()<.5?1:-1,y=rnd(L.hz+30,H*.62);G.shadows.push({id,dir,x:dir>0?-80:W+80,y,v:rnd(25,60)*dir,sc:lerp(.25,.7,(y-L.hz)/(H*.6-L.hz))});}
 G.shadows=G.shadows.filter(s=>{s.x+=s.v*dt;return s.x>-120&&s.x<W+120;});
 for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue;}if(p.ring){p.r+=p.vr*dt;continue;}p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.conf){p.rot+=p.vrot*dt;p.vx*=.99;}}
 for(let i=FT.length-1;i>=0;i--){FT[i].life-=dt;if(!FT[i].bang)FT[i].y-=dt*40;if(FT[i].life<=0)FT.splice(i,1);}
 if(G.wx==='rain'||G.wx==='storm'){const n=G.wx==='storm'?7:3;for(let i=0;i<n;i++)if(RAIN.length<260)RAIN.push({x:rnd(-40,W+40),y:rnd(-20,0),v:rnd(700,950)});}
 for(let i=RAIN.length-1;i>=0;i--){const r=RAIN[i];r.y+=r.v*dt;r.x-=r.v*dt*.18;if(r.y>H||(r.y>L.hz&&Math.random()<dt*2)){RAIN.splice(i,1);}}
 if(Math.floor(G.t*2)!==Math.floor((G.t-dt)*2))renderEnv();
}

  c.fillStyle='rgba(255,240,200,'+(na-.5)*.25+')';for(let i=0;i<10;i++){c.fillRect(mx-20+Math.sin(G.t*2+i)*14,L.hz+6+i*i*3,40-i*2,2);}}
 drawNeon(c,na,wxd);
 // water shimmer
 c.strokeStyle='rgba(255,255,255,'+(.07-na*.04)+')';c.lineWidth=1.2;for(let i=0;i<9;i++){const y=L.hz+12+i*i*5.5;if(y>H)break;c.beginPath();for(let x=0;x<=W;x+=24){const yy=y+Math.sin(x*.02+G.t*(1+i*.1)+i)*(1.5+i*.4);x?c.lineTo(x,yy):c.moveTo(x,yy);}c.stroke();}
 // shadows
 G.shadows.forEach(s=>{const im=silhouette('f'+s.id);const w=110*s.sc,h=w*im.height/im.width;c.save();c.globalAlpha=.16;c.translate(s.x,s.y);if(s.dir<0)c.scale(-1,1);c.drawImage(im,-w/2,-h/2,w,h);c.restore();});
 // hooked fish underwater

function drawHint(c){let t='';if(G.msgT>0)t=G.msg;else if(G.st==='idle'&&G.hint)t='👉 Tap the REEL to cast';else if(G.st==='power')t='Tap again in the GOLD zone!';else if(G.st==='wait')t=G.nib>0?'Nibble… wait for it…':'Waiting for a bite…';else if(G.st==='bite')t='TAP NOW!';
 if(!t||G.st==='fight')return;c.save();c.font='800 15px system-ui';c.textAlign='center';const y=SA.t+80;const w=c.measureText(t).width+28;c.globalAlpha=G.msgT>0?Math.min(1,G.msgT*2):.9;c.fillStyle='rgba(8,26,48,.78)';rr(c,W*.45-w/2,y-17,w,30,15);c.fill();c.fillStyle=G.st==='bite'?'#ff6b6b':'#fff';c.fillText(t,W*.45,y+3);c.restore();}
// ---------- HUD / DOM ----------
const $=id=>document.getElementById(id);
let lastSlots='';
function renderHUD(flash){$('lvlBadge').textContent=S.lvl;$('xpTxt').textContent='LEVEL '+S.lvl+' · '+S.xp+'/'+xpNeed(S.lvl);$('xpFill').style.width=(100*S.xp/xpNeed(S.lvl))+'%';$('coinTxt').textContent=S.coins.toLocaleString();
 ensureGoals();let h='';
 const lid=S.last>=0?S.last:0;h+='<div class="slot last" data-a="book" title="Catch log">'+'<img '+(S.last<0?'class="sil" ':'')+'src="'+ASSETS['f'+lid]+'"><span class="tag">LOG</span><span class="cnt">'+Object.keys(S.book).length+'/'+FISH.length+'</span></div>';
 S.goals.forEach((g,i)=>{let ic;if(g.k==='species')ic='<img class="sil" src="'+ASSETS['f'+g.id]+'">';else{const e={catch:'🐟',perfect:'🎯',rarity:'💎',combo:'🔥',weight:'⚖️'}[g.k];ic='<span style="font-size:20px">'+e+'</span>';}
  h+='<div class="slot goal'+(flash===i?' done':'')+'" data-g="'+i+'"><span class="tag">GOAL</span>'+ic+'<div class="gbar"><i style="width:'+(100*g.p/g.n)+'%"></i></div></div>';});
 for(let i=0;i<2;i++){const und=FISH.map((f,j)=>j).filter(j=>!S.book[j]);const id=und[i];if(id===undefined)break;h+='<div class="slot" data-a="book"><span class="tag">???</span><img class="sil" src="'+ASSETS['f'+id]+'"></div>';}
 if(h!==lastSlots){$('slots').innerHTML=h;lastSlots=h;}
 $('bMute').textContent=S.muted?'🔇':'🔊';}
function renderEnv(){const ph=phaseName();const pi={dawn:'🌅',day:'☀️',dusk:'🌇',night:'🌙'}[ph],wi={clear:'',cloudy:'☁️',rain:'🌧️',storm:'⛈️'}[G.wx];const t=pi+' '+ph[0].toUpperCase()+ph.slice(1)+(wi?' · '+wi:'')+(G.combo>1?'  🔥x'+G.combo:'');if($('env').textContent!==t)$('env').textContent=t;}
$('slots').addEventListener('click',e=>{const s=e.target.closest('.slot');if(!s)return;AU.click();if(s.dataset.g!==undefined){const g=S.goals[+s.dataset.g];toast('🎯 '+goalLabel(g)+' — '+g.p+'/'+g.n+'  (reward '+g.rw+')');}else openBook();});
$('bBook').onclick=()=>{AU.click();openBook();};$('bShop').onclick=()=>{AU.click();openShop('up');};
$('bMute').onclick=()=>{AU.unlock();S.muted=!S.muted;AU.setMute(S.muted);save();renderHUD();};
const MD=$('modal');
function closeModal(){MD.classList.remove('show');MD.innerHTML='';}
let mdOpenT=0;MD.addEventListener('click',e=>{if(e.target===MD&&performance.now()-mdOpenT>450&&MD.dataset.k!=='catch')closeModal();});
function openBook(){MD.dataset.k='book';const caught=Object.keys(S.book).length;let h='<div class="panel"><div class="phead"><h2>📖 Fish Book <small style="font-size:13px;opacity:.7">'+caught+'/'+FISH.length+'</small></h2><button class="btn close" onclick="closeModal()">✕</button></div><div class="pbody"><div class="stat"><span>🎣 Casts '+S.stats.casts+'</span><span>🐟 Catches '+S.stats.catches+'</span><span>🎯 Perfect '+S.stats.perfect+'</span><span>🔥 Best combo '+S.stats.bestCombo+'</span></div><div class="grid">';
 FISH.forEach((f,i)=>{const b=S.book[i];h+='<div class="card" style="border-color:'+(b?RAR[f.r].c+'aa':'#ffffff18')+'"><img '+(b?'':'class="sil" ')+'src="'+ASSETS['f'+i]+'"><b style="color:'+(b?RAR[f.r].c:'#fff8')+'">'+(b?f.n:'???')+'</b><small>'+(b?'×'+b.n+' · best '+b.best+' lb':RAR[f.r].n)+'</small></div>';});
 MD.innerHTML=h+'</div></div></div>';MD.classList.add('show');mdOpenT=performance.now();}
let shopTab='up';
function openShop(tab){shopTab=tab||shopTab;MD.dataset.k='shop';let h='<div class="panel"><div class="phead"><h2>🛒 Tackle Shop</h2><div class="tabs"><button class="btn tab'+(shopTab==='up'?' on':'')+'" onclick="openShop(\'up\')">Upgrades</button><button class="btn tab'+(shopTab==='lures'?' on':'')+'" onclick="openShop(\'lures\')">Lures</button></div><button class="btn close" onclick="closeModal()">✕</button></div><div class="pbody">';
 if(shopTab==='up')UPG.forEach(u=>{const l=S.up[u.k],cost=upCost(u,l),max=l>=MAXU;h+='<div class="row"><div class="ic">'+u.ic+'</div><div class="tx"><b>'+u.n+' <span style="opacity:.6">Lv '+l+'</span></b><div>'+u.d+'</div><div class="pips">'+Array.from({length:MAXU},(_,i)=>'<i class="'+(i<l?'on':'')+'"></i>').join('')+'</div></div><button class="btn buy'+(max||S.coins<cost?' no':'')+'" onclick="buyUp(\''+u.k+'\')">'+(max?'MAX':'<span class="coin"></span>'+cost.toLocaleString())+'</button></div>';});
 else LURES.forEach((lu,i)=>{const own=S.lures[i],eq=S.lure===i;h+='<div class="row"><div class="ic"><img src="'+ASSETS[lu.img]+'"></div><div class="tx"><b>'+lu.n+'</b><div>'+lu.d+'</div></div><button class="btn buy'+(eq?' eq':own?'':S.coins<lu.price?' no':'')+'" onclick="buyLure('+i+')">'+(eq?'EQUIPPED':own?'EQUIP':'<span class="coin"></span>'+lu.price.toLocaleString())+'</button></div>';});
 MD.innerHTML=h+'</div></div>';MD.classList.add('show');mdOpenT=performance.now();}
function upCost(u,l){return Math.round(u.base*Math.pow(1.75,l));}
function buyUp(k){const u=UPG.find(x=>x.k===k),l=S.up[k];if(l>=MAXU)return;const c=upCost(u,l);if(S.coins<c){AU.fail();toast('Need '+(c-S.coins)+' more coins');return;}S.coins-=c;S.up[k]++;AU.coin();AU.levelup();toast('⬆️ '+u.n+' → Lv '+S.up[k]);save();renderHUD();openShop('up');}
function buyLure(i){if(S.lures[i]){S.lure=i;AU.click();save();openShop('lures');return;}const p=LURES[i].price;if(S.coins<p){AU.fail();toast('Need '+(p-S.coins)+' more coins');return;}S.coins-=p;S.lures[i]=true;S.lure=i;AU.coin();AU.perfect();toast('🎣 '+LURES[i].n+' unlocked!');save();renderHUD();openShop('lures');}
function showCatch(F,f,coins,xp,isNew,rec,cm){MD.dataset.k='catch';const rc=RAR[f.r].c;
 MD.innerHTML='<div class="panel" id="catch" style="--rc:'+rc+'"><div id="rays"></div><img id="cFish" src="'+ASSETS['f'+F.id]+'"><div id="cInfo"><span id="cRar" style="background:'+rc+'">'+RAR[f.r].n+'</span>'+(isNew?'<span id="cNew">NEW!</span>':rec?'<span id="cNew" style="background:#f59e0b">RECORD!</span>':'')+'<div id="cName" style="color:'+(f.r?rc:'#fff')+'">'+f.n+'</div><div id="cW">'+F.w+' lb'+(G.perfect?' · 🎯 Perfect cast':'')+(cm>1?' · 🔥 x'+cm.toFixed(1):'')+'</div><div id="cRew"><span><i class="coin"></i>+'+coins+(isNew?' +'+25*(f.r+1)+' new':'')+'</span><span style="color:#5eead4">+'+xp+' XP</span></div><button class="btn" id="cGo">Keep Fishing ▶</button></div></div>';
 MD.classList.add('show');$('cGo').onclick=()=>{AU.click();closeModal();G.st='idle';G.caught=0;G.fight=null;};}
// ---------- boot ----------
function loadImgs(){return Promise.all(Object.keys(ASSETS).map(k=>new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r();};i.onerror=r;i.src=ASSETS[k];})));}
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!document.hidden){update(dt);draw();}requestAnimationFrame(loop);}
loadImgs().then(()=>{layout();G.tip={...L.tip0};ensureGoals();renderHUD();renderEnv();requestAnimationFrame(loop);});
addEventListener('resize',()=>{setTimeout(layout,60);});addEventListener('orientationchange',()=>setTimeout(layout,300));
setInterval(save,10000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
$('bStart').onclick=()=>{AU.unlock();AU.perfect();$('start').style.display='none';};
window.__G={G,S,FISH,action,openShop,openBook,selectLure,L:()=>L};
</script></body></html>
